name: Reusable Clang-Format Check

on:
  workflow_call:
    inputs:
      exclude-regex:
        description: 'The regex pattern for paths to exclude from formatting'
        required: true
        type: string

jobs:
  formatting-check:
    name: Formatting Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Run clang-format check using jidicula/clang-format-action
        uses: jidicula/clang-format-action@v4.15.0
        with:
          clang-format-version: '20'
          check-path: '.'
          fallback-style: 'none'
          exclude-regex: ${{ inputs.exclude-regex }}
