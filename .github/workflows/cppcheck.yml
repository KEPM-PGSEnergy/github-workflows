name: Reusable Cppcheck

on:
  workflow_call:
    inputs:
      enable:
        description: 'Comma-separated list of cppcheck checks to enable (e.g. "warning,style,performance,portability")'
        required: false
        type: string
        default: ''
      exclude-check:
        description: 'Comma-separated list of cppcheck checks to exclude'
        required: false
        type: string
        default: ''
      other-options:
        description: 'Additional flags passed verbatim to cppcheck (e.g. "--std=c99 -DSTM32F767xx")'
        required: false
        type: string
        default: ''
      inline-suppression:
        description: 'Enable inline cppcheck suppression comments'
        required: false
        type: boolean
        default: true

jobs:
  cppcheck:
    name: cppcheck
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run cppcheck
        uses: deep5050/cppcheck-action@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          enable: ${{ inputs.enable }}
          exclude_check: ${{ inputs.exclude-check }}
          other_options: ${{ inputs.other-options }}
          inline_suppression: ${{ inputs.inline-suppression && 'true' || 'false' }}

      - name: Upload report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cppcheck-Report
          path: cppcheck_report.txt
