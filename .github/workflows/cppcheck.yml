name: Reusable Cppcheck

on:
  workflow_call:
    inputs:
      enable:
        description: 'Cppcheck checks to enable (e.g. "all", "warning,style,performance,portability")'
        required: false
        type: string
        default: 'all'
      std:
        description: 'C/C++ standard (e.g. "c99", "c++17", "c++20")'
        required: false
        type: string
        default: 'c++20'
      platform:
        description: 'Cppcheck platform (e.g. "native", "avr8", "arm32-wchar4"). Pass "disable" to skip.'
        required: false
        type: string
        default: 'disable'
      exclude-check:
        description: 'Source file or directory to exclude (-i flag). Pass "disable" to skip.'
        required: false
        type: string
        default: 'disable'
      other-options:
        description: 'Additional cppcheck flags. Pass "disable" to skip.'
        required: false
        type: string
        default: 'disable'
      inline-suppression:
        description: 'Enable inline cppcheck suppression comments'
        required: false
        type: boolean
        default: false

jobs:
  cppcheck:
    name: cppcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run cppcheck
        uses: deep5050/cppcheck-action@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          enable: ${{ inputs.enable }}
          std: ${{ inputs.std }}
          platform: ${{ inputs.platform }}
          exclude_check: ${{ inputs.exclude-check }}
          other_options: ${{ inputs.other-options }}
          inline_suppression: ${{ inputs.inline-suppression && 'enable' || 'disable' }}

      - name: Upload report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cppcheck-Report
          path: cppcheck_report.txt
